packageExtensions:
  'dsh-codex-connect@0.1.0-alpha.4.47':
    peerDependencies:
      react: ^18.2.0 || ^19.1.1
    peerDependenciesMeta:
      # Removed by our patch; upstream registry metadata still lists it.
      '@deepseek-ai/dsh-invariants':
        optional: true

# pnpm validates peers from registry metadata before patchedDependencies is
# materialized; allow the versions that the reviewed patch declares.
peerDependencyRules:
  allowedVersions:
    'dsh-codex-connect>react': ^19.1.1
    'dsh-codex-connect>@deepseek-ai/dsh-*': 0.2.1-rc.2

patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  dsh-codex-connect@0.1.0-alpha.4.47: patches/dsh-codex-connect@0.1.0-alpha.4.47.patch
