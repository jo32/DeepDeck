packages:
  - apps/*
  - benchmarks/*
  - plugins/*
  # Historical upstream source retained for attribution only; it is no longer
  # part of the workspace, build, Cordis patch, or packaged runtime.
  - '!plugins/community-market'

allowBuilds:
  workerd: true
  '@google/genai': false
  bun: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: false
  open-computer-use: false
  pnpm: true
  protobufjs: false
  sharp: true

# Harness packages share Cordis service declarations and must stay on one ABI.
# Development API peers link to the exact RC checkout through root devDependencies.
# Keep third-party plugin dependencies on those same libraries before npm publication.
overrides:
  'dsh-codex-connect>@deepseek-ai/schemastery': link:vendor/deepseek-harness/vendor/schemastery
  'dsh-better-sidebar>@deepseek-ai/schemastery': link:vendor/deepseek-harness/vendor/schemastery
  dsh-codex-connect>@earendil-works/pi-ai: 1.1.0
  use-sync-external-store: 1.6.0

minimumReleaseAgeExclude:
  - dsh-codex-connect@0.1.0-alpha.4.47
  - '@pnpm/exe.darwin-arm64@12.0.0'
  - '@pnpm/exe.darwin-x64@12.0.0'
  - '@pnpm/exe.linux-arm64-musl@12.0.0'
  - '@pnpm/exe.linux-arm64@12.0.0'
  - '@pnpm/exe.linux-x64-musl@12.0.0'
  - '@pnpm/exe.linux-x64@12.0.0'
  - '@pnpm/exe.win32-arm64@12.0.0'
  - '@pnpm/exe.win32-x64@12.0.0'
  - pnpm@12.0.0
  - dsh-better-sidebar@0.28.0
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-include@1.0.10'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
  - '@deepseek-ai/cordis@4.0.5'
