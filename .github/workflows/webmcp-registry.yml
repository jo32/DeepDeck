name: WebMCP index

on:
  pull_request:
    paths: &index-paths
      - 'apps/webmcp-index/**'
      - 'apps/web/lib/webmcp-index.ts'
      - 'apps/web/app/api/webmcp/**'
      - 'scripts/sync-webmcp-registry*'
      - 'plugins/browser/src/github-webmcp.ts'
      - 'plugins/browser/src/webmcp-package.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/webmcp-registry.yml'
  push:
    branches: [main]
    paths: *index-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Install index dependencies
        run: npx --yes pnpm@12.0.0 install --filter @deepdeck/webmcp-index --frozen-lockfile
      - run: npx --yes pnpm@12.0.0 --filter @deepdeck/webmcp-index check
      - run: npx --yes pnpm@12.0.0 --filter @deepdeck/webmcp-index test
      - run: npx --yes pnpm@12.0.0 --filter @deepdeck/webmcp-index build
