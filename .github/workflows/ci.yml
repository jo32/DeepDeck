name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout with Harness submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.0.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled plugin dependencies
        run: pnpm codex-connect:install

      - name: Install Harness dependencies
        run: pnpm harness:install

      - name: Build Harness
        run: pnpm harness:build

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build DeepDeck
        run: pnpm build
