appId: com.jo32.deepdeck
productName: DeepDeck
executableName: DeepDeck
asar: true
forceCodeSigning: true
electronUpdaterCompatibility: ">=2.16"
afterPack: build/after-pack.cjs
afterSign: build/after-sign.cjs

directories:
  output: ../../release
  buildResources: ../../branding

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../../.deepdeck/runtime
    to: .
    filter:
      - runtime/**/*
      - harness/**/*
      - plugins/**/*
      - branding/**/*
      - cordis.patch.yml
      - runtime-manifest.json

artifactName: DeepDeck-${version}-${os}-${arch}.${ext}

mac:
  appId: com.jo32.deepdeck
  category: public.app-category.productivity
  icon: app-icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/deepdeck-update-helper
  extraResources:
    - from: ../../.deepdeck/update-helper/deepdeck-update-helper
      to: deepdeck-update-helper
  notarize: true
  extendInfo:
    CFBundleName: DeepDeck
    CFBundleDisplayName: DeepDeck
    NSCameraUsageDescription: Allow websites you approve in DeepDeck Browser to use your camera.
    NSMicrophoneUsageDescription: Allow websites you approve in DeepDeck Browser to use your microphone.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: DeepDeck ${version}

win:
  icon: app-icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: DeepDeck-Setup-${version}-win-${arch}.${ext}
  differentialPackage: true
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: ${env.UPDATE_FEED_URL}
  useMultipleRangeRequest: false
