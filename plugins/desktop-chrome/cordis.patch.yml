# DeepDeck desktop composition. The stock layout and rail-style sidebar,
# document identity and visual branding are owned by one desktop-shell plugin;
# Home presentation and Agent-preset settings remain separate contributions.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

# Let whichever single configured provider is usable own web search. Fresh
# DeepSeek profiles therefore use DeepSeek; ChatGPT onboarding enables the
# Codex search provider without leaving this row pinned to a missing key.
- id: web
  name: '@deepseek-ai/dsh-web'
  config: {}

- insert:
    - id: deepdeck-desktop-chrome
      name: '@deepdeck/dsh-client-ui-desktop-chrome'

    - id: deepdeck-home-hero
      name: '@deepdeck/dsh-client-ui-home-hero'

    - id: deepdeck-agent-preset-sections
      name: '@deepdeck/dsh-client-ui-agent-preset-sections'

    - id: deepdeck-community-market-desktop-bridge
      name: '@deepdeck/dsh-community-market-desktop-bridge'

    - id: deepdeck-first-run
      name: '@deepdeck/dsh-first-run'

    - id: llm-openai-codex
      name: 'dsh-codex-connect'
      config:
        enableSearch: false
        enableImageTool: false

    - id: community-market
      name: 'dsh-community-market'
