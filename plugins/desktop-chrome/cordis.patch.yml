# DeepDeck desktop composition. The stock layout and rail-style sidebar,
# document identity and visual branding are owned by one desktop-shell plugin;
# Home presentation and Agent-preset settings remain separate contributions.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

- insert:
    - id: openworkbuddy-desktop-chrome
      name: '@openworkbuddy/dsh-client-ui-desktop-chrome'

    - id: openworkbuddy-home-hero
      name: '@openworkbuddy/dsh-client-ui-home-hero'

    - id: openworkbuddy-agent-preset-sections
      name: '@openworkbuddy/dsh-client-ui-agent-preset-sections'
