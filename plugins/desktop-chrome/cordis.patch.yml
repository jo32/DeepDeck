# DeepDeck desktop composition. The stock layout and rail-style sidebar,
# document identity and visual branding are owned by one desktop-shell plugin;
# Home presentation and Agent-preset settings remain separate contributions.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

# DeepDeck owns the Settings shell so sections can contribute product-specific
# navigation semantics such as the Store storefront glyph. Feature-owned
# settings sections remain ordinary Cordis slot contributions.
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  disabled: true

# The include patch dialect treats `name` as a match guard, not a replacement.
# Disable the stock service here; DeepDeck's replacement is inserted below.
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: true

- insert:
    # Schedule the current Agent provider first, then race the other usable
    # providers asynchronously so a broken route cannot hold up the search.
    - id: deepdeck-provider-aware-web
      name: '@deepdeck/dsh-provider-aware-web'
      config: {}

    - id: deepdeck-desktop-chrome
      name: '@deepdeck/dsh-client-ui-desktop-chrome'

    - id: deepdeck-home-hero
      name: '@deepdeck/dsh-client-ui-home-hero'

    - id: deepdeck-agent-preset-sections
      name: '@deepdeck/dsh-client-ui-agent-preset-sections'

    - id: deepdeck-app-market-desktop-bridge
      name: '@deepdeck/dsh-app-market-desktop-bridge'

    - id: deepdeck-bun-plugin-builder
      name: '@deepdeck/dsh-bun-plugin-builder'

    - id: deepdeck-first-run
      name: '@deepdeck/dsh-first-run'

    - id: deepdeck-app-conversations
      name: '@deepdeck/dsh-app-conversations'

    # The management plugin remains loaded so Settings can re-enable the
    # feature. Its live preference controls the nested MCP loader entry, which
    # fully disposes the native process and unregisters its tools.
    - id: deepdeck-computer-use
      name: '@deepdeck/dsh-computer-use'

    # The group waits for the management service before constructing its child,
    # so the persisted preference is available during the first mount decision.
    # For enabled profiles, MCP discovery is part of the Host startup barrier.
    - id: deepdeck-computer-use-runtime
      name: cordis:group
      group: true
      inject:
        - deepdeckComputerUse
      config:
        - id: deepdeck-computer-use-mcp
          name: '@deepseek-ai/dsh-mcp-client'
          disabled: !!js ctx.deepdeckComputerUse.enabled === false
          config:
            serverName: open-computer-use
            transport: stdio
            command: !!js ctx.deepdeckComputerUse.mcpCommand
            args: !!js ctx.deepdeckComputerUse.mcpArgs
            cwd: !!js ctx.deepdeckComputerUse.root
            toolCallTimeoutMs: 120000
            failOnStartupError: false
            # This supervisor exists only while the enabled MCP row is mounted.
            # It restores the stdio proxy if that child process itself exits;
            # the proxy separately health-checks the signed native helper.
            reconnect:
              enabled: true
              initialDelayMs: 500
              maxDelayMs: 30000
              maxAttempts: 10

    - id: llm-openai-codex
      name: 'dsh-codex-connect'
      config:
        # Register the provider at startup; the provider-aware web seam invokes
        # it only for ChatGPT-backed sessions.
        enableSearch: true
        enableImageTool: false
